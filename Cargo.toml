[package]
name = "filetui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
unicode-width = "0.2"
chrono = "0.4"
filetime = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "ico"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
